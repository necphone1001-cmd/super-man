<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6b0f1a"/>
      <stop offset="1" stop-color="#8b0a1a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Speed lines -->
  <g stroke="#000" stroke-width="10" stroke-linecap="round" opacity="0.8">
    <line x1="80" y1="220" x2="160" y2="220"/>
    <line x1="70" y1="260" x2="150" y2="260"/>
    <line x1="90" y1="300" x2="170" y2="300"/>
  </g>
  <!-- Running stick figure -->
  <g fill="none" stroke="#000" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- head -->
    <circle cx="300" cy="150" r="24" fill="#000"/>
    <!-- torso -->
    <path d="M300 174 L290 228 L260 270"/>
    <!-- front arm -->
    <path d="M290 200 L330 190"/>
    <!-- back arm -->
    <path d="M292 210 L262 198"/>
    <!-- front leg -->
    <path d="M260 270 L310 300"/>
    <!-- back leg -->
    <path d="M260 270 L230 320"/>
  </g>
</svg>
